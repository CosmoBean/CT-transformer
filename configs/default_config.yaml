# Default classification config for the VinBigData 15-label subset.

data:
  data_dir: "data"
  train_csv: "train.csv"
  image_size: 512
  use_augmentation: false
  batch_size: 32
  num_workers: 4
  train_split: 0.8
  val_split: 0.2

model:
  name: "simple_cnn"  # simple_cnn, efficientnet_b3, resnet50, vit_base, swin_base_patch4_window7_224
  num_classes: 15
  pretrained: true
  dropout: 0.3

training:
  num_epochs: 50
  learning_rate: 1e-4
  weight_decay: 1e-4
  optimizer: "adamw"
  scheduler: "cosine"
  criterion: "bce"
  gradient_clip: 1.0
  early_stopping_patience: 10
  save_best: true
  metric_name: "auc_roc_macro"

device: "cuda"
use_multi_gpu: true
save_dir: "experiments/checkpoints"
log_dir: "experiments/logs"
seed: 28
